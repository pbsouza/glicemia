<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Glicemia</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      padding: 16px;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .btn-salvar.editando {
      background: #f59e0b;
    }

    .btn-salvar.editando:hover {
      background: #d97706;
    }

    .filtros {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .estatisticas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-titulo {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .stat-valor {
      font-size: 28px;
      font-weight: bold;
    }

    .registro {
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 12px;
      border-radius: 12px;
    }

    /* Cores alternadas (Zebra) na listagem da tela */
    .registro:nth-child(even) {
      background-color: #f9fafb;
    }
    .registro:nth-child(odd) {
      background-color: #ffffff;
    }

    .registro:last-child {
      border-bottom: none;
    }

    .registro-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .data-registro {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #111827;
    }

    .grid-medicoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .medicao-box {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e5e7eb;
    }

    .medicao-titulo {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .medicao-valor {
      font-size: 22px;
      font-weight: bold;
    }

    .normal {
      color: #16a34a;
    }

    .alta {
      color: #dc2626;
    }

    .baixa {
      color: #ea580c;
    }

    .btn-editar {
      width: auto;
      background: #f59e0b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .btn-editar:hover {
      background: #d97706;
    }

    .vazio {
      text-align: center;
      color: #6b7280;
      padding: 20px 0;
    }

    canvas {
      width: 100% !important;
      max-height: 380px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(3px);
    }

    .loading-box {
      background: white;
      padding: 22px 30px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 600px) {
      .grid-medicoes {
        grid-template-columns: 1fr;
      }

      .estatisticas {
        grid-template-columns: 1fr;
      }

      .registro-topo {
        flex-direction: column;
      }

      .btn-editar {
        width: 100%;
      }

      .filtros {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>Controle de Glicemia</h1>

      <div class="form-group">
        <label>Data</label>
        <input type="date" id="data">
      </div>

      <div class="form-group">
        <label>Café da manhã - Jejum</label>
        <input type="number" id="jejum" placeholder="Ex: 92">
      </div>

      <div class="form-group">
        <label>Almoço - Antes</label>
        <input type="number" id="almocoAntes" placeholder="Ex: 105">
      </div>

      <div class="form-group">
        <label>Almoço - 1 hora depois</label>
        <input type="number" id="almocoDepois" placeholder="Ex: 138">
      </div>

      <div class="form-group">
        <label>Jantar - Antes</label>
        <input type="number" id="jantarAntes" placeholder="Ex: 112">
      </div>

      <div class="form-group">
        <label>Antes de deitar</label>
        <input type="number" id="deitar" placeholder="Ex: 98">
      </div>

      <button id="btnSalvar" class="btn-salvar" onclick="salvarRegistro()">
        Salvar Medição
      </button>
    </div>

    <div class="card">
      <div class="filtros">
        <input type="date" id="filtroInicio">
        <input type="date" id="filtroFim">
      </div>
      <button onclick="aplicarFiltros()">Filtrar</button>
      <br><br>
      <button onclick="gerarPDF()">Gerar Relatório PDF</button>
    </div>

    <div class="card">
      <div class="estatisticas">
        <div class="stat-box">
          <div class="stat-titulo">Média Geral</div>
          <div class="stat-valor" id="mediaGeral">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-titulo">Dias Registrados</div>
          <div class="stat-valor" id="diasRegistrados">--</div>
        </div>
      </div>
      <canvas id="graficoGlicemia"></canvas>
    </div>

    <div class="card">
      <div id="listaRegistros">
        <div class="vazio">Carregando registros...</div>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="loading-box" id="loadingTexto">Salvando...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxsncjeSmIgwvvZrcik9GyELD1KmonKEuMQEIxvRFhm4kE9eS4n83U5LZbJJ5PoNt59/exec";

    const dataInput = document.getElementById('data');
    const btnSalvar = document.getElementById('btnSalvar');
    const listaRegistros = document.getElementById('listaRegistros');
    const loading = document.getElementById('loading');
    const loadingTexto = document.getElementById('loadingTexto');
    const mediaGeral = document.getElementById('mediaGeral');
    const diasRegistrados = document.getElementById('diasRegistrados');
    const filtroInicio = document.getElementById('filtroInicio');
    const filtroFim = document.getElementById('filtroFim');

    let linhaEditando = null;
    let grafico = null;
    let todosRegistros = [];

    function preencherDataAtual() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      dataInput.value = `${ano}-${mes}-${dia}`;
    }

    preencherDataAtual();

    function classificar(valor) {
      valor = Number(valor);
      if (!valor) return '';
      if (valor < 70) return 'baixa';
      if (valor > 140) return 'alta';
      return 'normal';
    }

    function formatarData(dataString) {
      if (!dataString) return '--/--/--';
      const partes = dataString.split('T')[0].split('-');
      return `${partes[2]}/${partes[1]}/${partes[0]}`.replace(/\s/g, '');
    }

    async function salvarRegistro() {
      const dados = {
        data: dataInput.value,
        jejum: document.getElementById('jejum').value,
        almocoAntes: document.getElementById('almocoAntes').value,
        almocoDepois: document.getElementById('almocoDepois').value,
        jantarAntes: document.getElementById('jantarAntes').value,
        deitar: document.getElementById('deitar').value
      };

      if (!dados.data) {
        alert('Preencha a data.');
        return;
      }

      loadingTexto.innerText = linhaEditando ? 'Atualizando...' : 'Salvando...';
      loading.style.display = 'flex';

      try {
        const resposta = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dados)
        });

        await resposta.json();

        linhaEditando = null;
        btnSalvar.innerText = 'Salvar Medição';
        btnSalvar.classList.remove('editando');

        document.getElementById('jejum').value = '';
        document.getElementById('almocoAntes').value = '';
        document.getElementById('almocoDepois').value = '';
        document.getElementById('jantarAntes').value = '';
        document.getElementById('deitar').value = '';

        preencherDataAtual();
        await carregarRegistros();
        alert('Registro salvo com sucesso!');

      } catch (erro) {
        console.error(erro);
        alert('Erro ao salvar.');
      } finally {
        loading.style.display = 'none';
      }
    }

    async function carregarRegistros() {
      listaRegistros.innerHTML = `<div class="vazio">Carregando...</div>`;
      try {
        const resposta = await fetch(API_URL);
        const registros = await resposta.json();
        renderizarRegistros(registros);
      } catch (erro) {
        console.error(erro);
        listaRegistros.innerHTML = `<div class="vazio">Erro ao carregar registros.</div>`;
      }
    }

    function editarRegistro(registro) {
      dataInput.value = registro.data.split('T')[0];
      document.getElementById('jejum').value = registro.jejum || '';
      document.getElementById('almocoAntes').value = registro.almocoAntes || '';
      document.getElementById('almocoDepois').value = registro.almocoDepois || '';
      document.getElementById('jantarAntes').value = registro.jantarAntes || '';
      document.getElementById('deitar').value = registro.deitar || '';

      linhaEditando = registro.linha;
      btnSalvar.innerText = 'Atualizar Medição';
      btnSalvar.classList.add('editando');

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    function criarBox(titulo, valor) {
      return `
        <div class="medicao-box">
          <div class="medicao-titulo">${titulo}</div>
          <div class="medicao-valor ${classificar(valor)}">
            ${valor || '--'}
          </div>
        </div>
      `;
    }

    function renderizarRegistros(registros) {
      todosRegistros = [...registros];

      if (!registros.length) {
        listaRegistros.innerHTML = `<div class="vazio">Nenhum registro encontrado.</div>`;
        return;
      }

      registros.sort((a, b) => new Date(b.data) - new Date(a.data));
      listaRegistros.innerHTML = '';

      const labels = [];
      const jejumData = [];
      const almocoAntesData = [];
      const almocoDepoisData = [];
      const jantarAntesData = [];
      const deitarData = [];

      let soma = 0;
      let quantidade = 0;

      registros.forEach(registro => {
        labels.push(formatarData(registro.data));
        jejumData.push(registro.jejum || null);
        almocoAntesData.push(registro.almocoAntes || null);
        almocoDepoisData.push(registro.almocoDepois || null);
        jantarAntesData.push(registro.jantarAntes || null);
        deitarData.push(registro.deitar || null);

        [
          registro.jejum,
          registro.almocoAntes,
          registro.almocoDepois,
          registro.jantarAntes,
          registro.deitar
        ].forEach(valor => {
          if (valor) {
            soma += Number(valor);
            quantidade++;
          }
        });

        listaRegistros.innerHTML += `
          <div class="registro">
            <div class="registro-topo">
              <div style="width:100%;">
                <div class="data-registro">${formatarData(registro.data)}</div>
                <div class="grid-medicoes">
                  ${criarBox('Jejum', registro.jejum)}
                  ${criarBox('Almoço - Antes', registro.almocoAntes)}
                  ${criarBox('1h Depois', registro.almocoDepois)}
                  ${criarBox('Jantar - Antes', registro.jantarAntes)}
                  ${criarBox('Antes de Deitar', registro.deitar)}
                </div>
              </div>
              <button class="btn-editar" onclick='editarRegistro(${JSON.stringify(registro)})'>Editar</button>
            </div>
          </div>
        `;
      });

      mediaGeral.innerText = quantidade ? (soma / quantidade).toFixed(0) : '--';
      diasRegistrados.innerText = registros.length;

      atualizarGrafico(
        labels.reverse(),
        jejumData.reverse(),
        almocoAntesData.reverse(),
        almocoDepoisData.reverse(),
        jantarAntesData.reverse(),
        deitarData.reverse()
      );
    }

    function atualizarGrafico(labels, jejum, almocoAntes, almocoDepois, jantarAntes, deitar) {
      const ctx = document.getElementById('graficoGlicemia');
      if (grafico) grafico.destroy();

      grafico = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Jejum', data: jejum, borderWidth: 3, tension: 0.3 },
            { label: 'Almoço - Antes', data: almocoAntes, borderWidth: 3, tension: 0.3 },
            { label: 'Almoço - 1h Depois', data: almocoDepois, borderWidth: 3, tension: 0.3 },
            { label: 'Jantar - Antes', data: jantarAntes, borderWidth: 3, tension: 0.3 },
            { label: 'Antes de Deitar', data: deitar, borderWidth: 3, tension: 0.3 }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    function aplicarFiltros() {
      const inicio = filtroInicio.value;
      const fim = filtroFim.value;
      let filtrados = [...todosRegistros];

      if (inicio) {
        filtrados = filtrados.filter(r => r.data.split('T')[0] >= inicio);
      }
      if (fim) {
        filtrados = filtrados.filter(r => r.data.split('T')[0] <= fim);
      }

      renderizarRegistros(filtrados);
    }

function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('portrait');

  pdf.setFontSize(15);
  pdf.setTextColor('#111827'); 
  pdf.text('CONTROLE GLICÊMICO', 105, 15, { align: 'center' });

  let y = 20;

  const colunas = [
    { titulo: 'DATA', x: 15, w: 24 },
    { titulo: 'CAFÉ DA MANHÃ\n(JEJUM)', x: 39, w: 32 },
    { titulo: 'ALMOÇO\nANTES', x: 71, w: 30 },
    { titulo: 'ALMOÇO\n1 HORA DEPOIS', x: 101, w: 38 },
    { titulo: 'JANTAR\nANTES', x: 139, w: 30 },
    { titulo: 'ANTES DE\nDEITAR', x: 169, w: 30 }
  ];

  function desenharCabecalho() {
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(8);
    
    colunas.forEach(coluna => {
      pdf.setFillColor('#E5E7EB');
      pdf.rect(coluna.x, y, coluna.w, 10, 'F');
      
      pdf.setDrawColor('#737373');
      pdf.setLineWidth(0.3);
      pdf.rect(coluna.x, y, coluna.w, 10, 'S');

      pdf.setTextColor('#111827'); 
      const linhas = coluna.titulo.split('\n');
      if (linhas.length === 1) {
        // Corrigido aqui: mudado de column.x para coluna.x
        pdf.text(linhas[0], coluna.x + coluna.w / 2, y + 6, { align: 'center' });
      } else {
        // Corrigido aqui: mudado de column.x para coluna.x
        pdf.text(linhas[0], coluna.x + coluna.w / 2, y + 4, { align: 'center' });
        pdf.text(linhas[1], coluna.x + coluna.w / 2, y + 8, { align: 'center' });
      }
    });

    pdf.setFont('helvetica', 'normal');
    y += 10;
  }

  desenharCabecalho();

  const registrosOrdenados = [...todosRegistros].sort((a, b) => new Date(a.data) - new Date(b.data));

  const alturaCelula = 7; 

  registrosOrdenados.forEach((registro, numLinha) => {
    if (y > 270) { 
      pdf.addPage('portrait');
      y = 20;
      desenharCabecalho();
    }

    // Extrai a data no padrão dd/mm/yy
    let dataFormatada = '--/--/--';
    if (registro.data) {
      const partes = registro.data.split('T')[0].split('-'); 
      const anoDoisDigitos = partes[0].slice(-2); 
      dataFormatada = `${partes[2]}/${partes[1]}/${anoDoisDigitos}`;
    }

    const linha = [
      dataFormatada, 
      registro.jejum || '',
      registro.almocoAntes || '',
      registro.almocoDepois || '',
      registro.jantarAntes || '',
      registro.deitar || ''
    ];

    const corFundo = (numLinha % 2 === 0) ? '#F3F4F6' : '#FFFFFF';

    linha.forEach((texto, index) => {
      const coluna = colunas[index];
      
      pdf.setFillColor(corFundo);
      pdf.rect(coluna.x, y, coluna.w, alturaCelula, 'F');
      
      pdf.setDrawColor('#9CA3AF');
      pdf.setLineWidth(0.3);
      pdf.rect(coluna.x, y, coluna.w, alturaCelula, 'S');
      
      pdf.setTextColor('#111827'); 
      pdf.setFontSize(11);
      pdf.text(String(texto), coluna.x + coluna.w / 2, y + 5, { align: 'center' });
    });

    y += alturaCelula;
  });

  pdf.save('controle_glicemico.pdf');
}

    carregarRegistros();
  </script>

</body>
</html>
