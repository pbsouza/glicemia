<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8"/>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Controle de Glicemia</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f6f8;
      padding:16px;
      color:#222;
    }

    .container{
      max-width:500px;
      margin:auto;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:18px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
      margin-bottom:18px;
    }

    h1{
      text-align:center;
      margin-bottom:18px;
      font-size:24px;
    }

    .form-group{
      margin-bottom:14px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size:14px;
      font-weight:bold;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #ccc;
      font-size:16px;
      background:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
      margin-top:8px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .btn-editar{
      background:#f59e0b;
      width:auto;
      padding:10px 14px;
      font-size:13px;
      border-radius:10px;
      flex-shrink:0;
    }

    .btn-editar:hover{
      background:#d97706;
    }

    .registro{
      border-bottom:1px solid #eee;
      padding:12px 0;
    }

    .registro:last-child{
      border-bottom:none;
    }

    .topo-registro{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .valor{
      font-size:24px;
      font-weight:bold;
    }

    .normal{
      color:#16a34a;
    }

    .alta{
      color:#dc2626;
    }

    .baixa{
      color:#ea580c;
    }

    .tipo-medicao{
      margin-top:6px;
      font-size:13px;
      font-weight:bold;
      color:#2563eb;
    }

    .datahora{
      margin-top:6px;
      font-size:14px;
      color:#666;
      line-height:1.5;
    }

    .filtros{
      display:flex;
      gap:10px;
      margin-bottom:14px;
    }

    .estatisticas{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:18px;
    }

    .stat-box{
      background:#f8fafc;
      padding:14px;
      border-radius:14px;
      text-align:center;
    }

    .stat-titulo{
      font-size:13px;
      color:#666;
      margin-bottom:6px;
    }

    .stat-valor{
      font-size:26px;
      font-weight:bold;
    }

    canvas{
      width:100% !important;
      max-height:320px;
    }

    .vazio{
      text-align:center;
      color:#777;
      padding:20px 0;
    }

    #loading{
      position:fixed;
      inset:0;
      background:rgba(255,255,255,.85);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
      backdrop-filter:blur(3px);
    }

    .loading-box{
      background:white;
      padding:20px 30px;
      border-radius:18px;
      font-size:18px;
      font-weight:bold;
      box-shadow:0 4px 20px rgba(0,0,0,.15);
    }

    @media(max-width:480px){

      body{
        padding:10px;
      }

      .filtros{
        flex-direction:column;
      }

      .valor{
        font-size:22px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>Controle de Glicemia</h1>

    <div class="form-group">
      <label>Dia</label>
      <input type="date" id="data">
    </div>

    <div class="form-group">
      <label>Hora</label>
      <input type="time" id="hora">
    </div>

    <div class="form-group">
      <label>Valor da Glicemia</label>
      <input
        type="number"
        id="glicemia"
        placeholder="Ex: 98"
      >
    </div>

    <div class="form-group">
      <label>Tipo da Medição</label>

      <select id="tipo">

        <option value="Jejum">
          Jejum
        </option>

        <option value="Pós Refeição">
          Pós Refeição
        </option>

      </select>
    </div>

    <button onclick="salvarRegistro()">
      Salvar Medição
    </button>

  </div>

  <div class="card">

    <div class="filtros">

      <input
        type="date"
        id="filtroInicio"
      >

      <input
        type="date"
        id="filtroFim"
      >

    </div>

    <button onclick="aplicarFiltros()">
      Filtrar
    </button>

    <button onclick="gerarPDF()">
      Gerar Relatório PDF
    </button>

  </div>

  <div class="card">

    <div class="estatisticas">

      <div class="stat-box">

        <div class="stat-titulo">
          Média Diária
        </div>

        <div
          class="stat-valor"
          id="mediaDiaria"
        >
          --
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-titulo">
          Média Geral
        </div>

        <div
          class="stat-valor"
          id="mediaSemanal"
        >
          --
        </div>

      </div>

    </div>

    <canvas id="graficoGlicemia"></canvas>

  </div>

  <div class="card">

    <div id="listaRegistros">

      <div class="vazio">
        Carregando registros...
      </div>

    </div>

  </div>

</div>

<div id="loading">

  <div class="loading-box">
    Salvando...
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyZFrIC5oooX_M4jp5s3E8VpxXpbnJWM2H-BcHls_o3FPrFEq9GpNWcKbbQVou92PC3LQ/exec";

const dataInput =
document.getElementById('data');

const horaInput =
document.getElementById('hora');

const glicemiaInput =
document.getElementById('glicemia');

const tipoInput =
document.getElementById('tipo');

const listaRegistros =
document.getElementById('listaRegistros');

const mediaDiaria =
document.getElementById('mediaDiaria');

const mediaSemanal =
document.getElementById('mediaSemanal');

const filtroInicio =
document.getElementById('filtroInicio');

const filtroFim =
document.getElementById('filtroFim');

const loading =
document.getElementById('loading');

let grafico = null;

let linhaEditando = null;

let todosRegistros = [];

function preencherDataHoraAtual(){

  const agora = new Date();

  const ano = agora.getFullYear();

  const mes =
  String(agora.getMonth()+1)
  .padStart(2,'0');

  const dia =
  String(agora.getDate())
  .padStart(2,'0');

  const hora =
  String(agora.getHours())
  .padStart(2,'0');

  const minuto =
  String(agora.getMinutes())
  .padStart(2,'0');

  dataInput.value =
  `${ano}-${mes}-${dia}`;

  horaInput.value =
  `${hora}:${minuto}`;
}

preencherDataHoraAtual();

function classificar(valor){

  valor = Number(valor);

  if(valor < 70){
    return 'baixa';
  }

  if(valor > 140){
    return 'alta';
  }

  return 'normal';
}

function formatarData(data){

  const partes =
  data.split('T')[0]
  .split('-');

  return `${partes[2]}/${partes[1]}/${partes[0].slice(-2)}`;
}

function formatarHora(hora){

  if(hora.includes('T')){

    const partes =
    hora.split('T')[1]
    .split(':');

    return `${partes[0]}:${partes[1]}`;
  }

  return hora.slice(0,5);
}

async function salvarRegistro(){

  const dados = {

    data:dataInput.value,
    hora:horaInput.value,
    glicemia:glicemiaInput.value,
    tipo:tipoInput.value

  };

  if(linhaEditando){
    dados.linha = linhaEditando;
  }

  loading.style.display='flex';

  try{

    await fetch(API_URL,{
      method:'POST',
      body:JSON.stringify(dados)
    });

    linhaEditando = null;

    glicemiaInput.value='';

    tipoInput.value='Jejum';

    preencherDataHoraAtual();

    await carregarRegistros();

    alert('Medição salva!');

  }catch(erro){

    alert('Erro ao salvar.');

    console.error(erro);

  }

  loading.style.display='none';
}

async function carregarRegistros(){

  try{

    const resposta =
    await fetch(API_URL);

    const registros =
    await resposta.json();

    todosRegistros = registros;

    renderizarRegistros(registros);

  }catch(erro){

    console.error(erro);

  }
}

function editarRegistro(registro){

  dataInput.value =
  registro.data.split('T')[0];

  horaInput.value =
  formatarHora(registro.hora);

  glicemiaInput.value =
  registro.glicemia;

  tipoInput.value =
  registro.tipo || 'Jejum';

  linhaEditando =
  registro.linha;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function renderizarRegistros(registros){

  if(!registros.length){

    listaRegistros.innerHTML=`
      <div class="vazio">
        Nenhum registro encontrado.
      </div>
    `;

    return;
  }

  listaRegistros.innerHTML='';

  let soma = 0;

  const labels = [];

  const valores = [];

  registros.reverse().forEach(registro=>{

    soma += Number(registro.glicemia);

    labels.push(
      `${formatarData(registro.data)} ${formatarHora(registro.hora)}`
    );

    valores.push(
      Number(registro.glicemia)
    );

    const classe =
    classificar(registro.glicemia);

    listaRegistros.innerHTML += `

      <div class="registro">

        <div class="topo-registro">

          <div>

            <div class="valor ${classe}">
              ${registro.glicemia} mg/dL
            </div>

            <div class="tipo-medicao">
              ${registro.tipo || 'Jejum'}
            </div>

            <div class="datahora">

              Data:
              ${formatarData(registro.data)}

              <br>

              Hora:
              ${formatarHora(registro.hora)}

            </div>

          </div>

          <button
            class="btn-editar"
            onclick='editarRegistro(${JSON.stringify(registro)})'
          >
            Editar
          </button>

        </div>

      </div>

    `;
  });

  const media =
  (soma/registros.length)
  .toFixed(0);

  mediaDiaria.innerText = media;

  mediaSemanal.innerText = media;

  atualizarGrafico(labels,valores);
}

function atualizarGrafico(labels,valores){

  const ctx =
  document.getElementById('graficoGlicemia');

  if(grafico){
    grafico.destroy();
  }

  grafico = new Chart(ctx,{

    type:'line',

    data:{

      labels,

      datasets:[{

        label:'Glicemia',

        data:valores,

        tension:.3,

        fill:true

      }]
    }

  });
}

function aplicarFiltros(){

  const inicio =
  filtroInicio.value;

  const fim =
  filtroFim.value;

  let filtrados =
  [...todosRegistros];

  if(inicio){

    filtrados =
    filtrados.filter(r=>
      r.data.split('T')[0] >= inicio
    );
  }

  if(fim){

    filtrados =
    filtrados.filter(r=>
      r.data.split('T')[0] <= fim
    );
  }

  renderizarRegistros(filtrados);
}

async function gerarPDF(){

  const inicio =
  filtroInicio.value;

  const fim =
  filtroFim.value;

  let registrosFiltrados =
  [...todosRegistros];

  if(inicio){

    registrosFiltrados =
    registrosFiltrados.filter(r=>
      r.data.split('T')[0] >= inicio
    );
  }

  if(fim){

    registrosFiltrados =
    registrosFiltrados.filter(r=>
      r.data.split('T')[0] <= fim
    );
  }

  if(!registrosFiltrados.length){

    alert(
      'Nenhum registro encontrado nesse período.'
    );

    return;
  }

  const { jsPDF } =
  window.jspdf;

  const pdf =
  new jsPDF();

  let y = 20;

  pdf.setFontSize(20);

  pdf.text(
    'Relatório de Glicemia',
    20,
    y
  );

  y += 10;

  pdf.setFontSize(11);

  pdf.text(
    `Período: ${inicio || 'Início'} até ${fim || 'Hoje'}`,
    20,
    y
  );

  y += 10;

  pdf.text(
    `Média diária: ${mediaDiaria.innerText} mg/dL`,
    20,
    y
  );

  y += 8;

  pdf.text(
    `Média geral: ${mediaSemanal.innerText} mg/dL`,
    20,
    y
  );

  y += 15;

const agrupados = {};

registrosFiltrados.forEach(registro => {

  const data =
    formatarData(registro.data);

  if (!agrupados[data]) {
    agrupados[data] = [];
  }

  agrupados[data].push(registro);

});

Object.keys(agrupados).reverse().forEach(data => {

  if (y > 260) {

    pdf.addPage();

    y = 20;
  }

  pdf.setFontSize(12);

  pdf.text(
    `Data: ${data}`,
    20,
    y
  );

  y += 8;

  pdf.setFontSize(10);

  agrupados[data].forEach(registro => {

    if (y > 270) {

      pdf.addPage();

      y = 20;
    }

    pdf.text(

      `• ${formatarHora(registro.hora)} | ` +
      `${registro.glicemia} mg/dL | ` +
      `${registro.tipo || 'Jejum'}`,

      28,
      y

    );

    y += 7;

  });

  y += 5;

});

  const canvas =
  document.getElementById('graficoGlicemia');

  const imagem =
  canvas.toDataURL('image/png');

  pdf.addPage();

  pdf.setFontSize(16);

  pdf.text(
    'Gráfico de Glicemia',
    20,
    20
  );

  pdf.addImage(
    imagem,
    'PNG',
    15,
    35,
    180,
    90
  );

  pdf.save(
    'relatorio-glicemia.pdf'
  );
}

carregarRegistros();

</script>

</body>
</html>
